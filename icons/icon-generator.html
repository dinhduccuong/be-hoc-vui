<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Icon Generator - Bé Học Vui</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f0f0f0;
        }
        button {
            padding: 15px 30px;
            font-size: 18px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin: 10px;
        }
        button:hover {
            background: #764ba2;
        }
        #preview {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 20px;
        }
        .icon-preview {
            text-align: center;
        }
        canvas {
            border: 2px solid #333;
            margin: 5px;
        }
    </style>
</head>
<body>
    <h1>🎨 Icon Generator - Bé Học Vui</h1>
    <p>Nhấn nút để tạo và tải xuống tất cả icons cho PWA</p>
    <button onclick="generateAllIcons()">Tạo và Tải Xuống Tất Cả Icons</button>
    <div id="preview"></div>

    <script>
        function generateIcon(size) {
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            
            // Background gradient
            const gradient = ctx.createLinearGradient(0, 0, size, size);
            gradient.addColorStop(0, '#667eea');
            gradient.addColorStop(1, '#764ba2');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, size, size);
            
            // White circle background
            ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
            ctx.beginPath();
            ctx.arc(size / 2, size / 2, size * 0.4, 0, Math.PI * 2);
            ctx.fill();
            
            // Game controller icon
            ctx.fillStyle = '#fff';
            ctx.font = `bold ${size * 0.35}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('🎮', size / 2, size * 0.4);
            
            // Text "Bé"
            ctx.font = `bold ${size * 0.25}px Arial`;
            ctx.fillText('Bé', size / 2, size * 0.7);
            
            return canvas;
        }

        function downloadCanvas(canvas, filename) {
            canvas.toBlob(blob => {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            });
        }

        function generateAllIcons() {
            const sizes = [72, 96, 128, 144, 152, 192, 384, 512];
            const preview = document.getElementById('preview');
            preview.innerHTML = '';
            
            sizes.forEach((size, index) => {
                setTimeout(() => {
                    const canvas = generateIcon(size);
                    
                    // Add to preview
                    const div = document.createElement('div');
                    div.className = 'icon-preview';
                    const previewCanvas = canvas.cloneNode(true);
                    previewCanvas.style.width = '100px';
                    previewCanvas.style.height = '100px';
                    div.appendChild(previewCanvas);
                    const label = document.createElement('div');
                    label.textContent = `${size}x${size}`;
                    div.appendChild(label);
                    preview.appendChild(div);
                    
                    // Download
                    downloadCanvas(canvas, `icon-${size}x${size}.png`);
                }, index * 500); // Delay to avoid browser blocking multiple downloads
            });
            
            alert('Đang tạo icons... Vui lòng cho phép tải xuống nhiều file!');
        }
    </script>
</body>
</html>
