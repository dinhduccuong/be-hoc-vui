<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TH - Thử Thách Tìm Từ</title>
    <style>
        body {
            margin: 0; padding: 10px; overflow: hidden;
            background: linear-gradient(180deg, #87ceeb 0%, #e0f7fa 100%);
            font-family: Arial, sans-serif; touch-action: none;
        }
        #start-overlay {
            position: fixed; inset: 0; background: white; z-index: 100;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .btn-start {
            padding: 20px 60px; font-size: 32px; font-weight: bold;
            background: #26a69a; color: white; border: none; border-radius: 60px;
            cursor: pointer; box-shadow: 0 10px 0 #00897b;
        }
        #ui {
            position: absolute; top: 15px; width: 100%; text-align: center;
            pointer-events: none; z-index: 10;
        }
        .info-box {
            font-size: 24px; color: #00695c; font-weight: bold;
            background: rgba(255,255,255,0.9); padding: 10px 25px; border-radius: 30px;
        }
        canvas {
            display: block; margin: 0 auto;
            border-radius: 20px;
        }
        .btn-back {
            position: fixed; top: 15px; left: 15px;
            background: #667eea; color: white; border: none;
            padding: 10px 20px; border-radius: 25px;
            font-size: 16px; font-weight: bold; cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2); z-index: 50;
            text-decoration: none; display: inline-block;
        }
        .btn-back:hover { background: #5568d3; }
        
        @media (max-width: 600px) {
            .btn-back { top: 10px; left: 10px; padding: 8px 15px; font-size: 14px; }
            .info-box { font-size: 18px; padding: 8px 20px; }
            #start-overlay h1 { font-size: 32px !important; }
            .btn-start { padding: 15px 40px; font-size: 24px; }
        }
    </style>
</head>
<body>
    <a href="../index.html" class="btn-back">← Quay lại</a>

    <div id="start-overlay">
        <h1 style="color: #26a69a; font-size: 40px;">🐰 Thỏ Tìm Từ TH</h1>
        <p style="font-size: 20px; color: #666; padding: 0 30px; text-align: center;">
            Giúp Thỏ nhặt các vật có chữ TH!<br>
            <small>(Tránh các vật không có TH nhé!)</small>
        </p>
        <button class="btn-start" onclick="startGame()">BẮT ĐẦU 🥕</button>
    </div>

    <div id="ui">
        <div class="info-box">🥕 Điểm: <span id="score">0</span> | ❤️ Máu: <span id="lives">3</span></div>
    </div>

    <canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const livesEl = document.getElementById('lives');

let score = 0;
let lives = 3;
let gameActive = false;
let femaleVoice = null;

// Thỏ
const rabbit = {
    x: 100, y: 0, w: 60, h: 60,
    dy: 0, jumpForce: -12, gravity: 0.6,
    groundY: 0, onGround: true
};

// Vật phẩm
let items = [];

// Từ có TH (đúng) và không có TH (sai)
const correctItems = [
    { word: 'THÌA', icon: '🥄', hasTH: true },
    { word: 'THUYỀN', icon: '⛵', hasTH: true },
    { word: 'THÔNG', icon: '🌲', hasTH: true },
    { word: 'THÚ', icon: '🦁', hasTH: true },
    { word: 'THƠM', icon: '🌺', hasTH: true },
    { word: 'THƯỚC', icon: '📏', hasTH: true }
];

const wrongItems = [
    { word: 'TÚI', icon: '👜', hasTH: false },
    { word: 'TỦ', icon: '🗄️', hasTH: false },
    { word: 'TÔ', icon: '🥣', hasTH: false },
    { word: 'TÀU', icon: '🚂', hasTH: false }
];

function loadVoices() {
    const voices = window.speechSynthesis.getVoices();
    femaleVoice = voices.find(v => v.lang.includes('vi')) || voices[0];
}
window.speechSynthesis.onvoiceschanged = loadVoices;
loadVoices();

function speak(text) {
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    if (femaleVoice) utter.voice = femaleVoice;
    utter.lang = 'vi-VN';
    utter.rate = 0.7;
    window.speechSynthesis.speak(utter);
}

function startGame() {
    document.getElementById('start-overlay').style.display = 'none';
    canvas.width = Math.min(window.innerWidth - 20, 800);
    canvas.height = Math.min(window.innerHeight - 100, 600);
    rabbit.groundY = canvas.height - 80;
    rabbit.y = rabbit.groundY;
    
    score = 0;
    lives = 3;
    items = [];
    gameActive = true;
    speak("Giúp Thỏ nhặt các vật có chữ TH nhé!");
    requestAnimationFrame(update);
}

function spawnItem() {
    const allItems = [...correctItems, ...wrongItems];
    const item = allItems[Math.floor(Math.random() * allItems.length)];
    items.push({
        x: canvas.width + 50,
        y: rabbit.groundY + 10,
        w: 50, h: 50,
        speed: 3,
        ...item
    });
}

let spawnTimer = 0;
function update() {
    if (!gameActive) return;
    
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // Vẽ nền
    const skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
    skyGrad.addColorStop(0, '#87ceeb');
    skyGrad.addColorStop(1, '#e0f7fa');
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    // Vẽ mặt đất
    ctx.fillStyle = '#8bc34a';
    ctx.fillRect(0, rabbit.groundY + rabbit.h, canvas.width, canvas.height);
    ctx.fillStyle = '#689f38';
    for (let i = 0; i < canvas.width; i += 30) {
        ctx.fillRect(i, rabbit.groundY + rabbit.h, 20, 5);
    }
    
    // Xử lý nhảy
    if (!rabbit.onGround) {
        rabbit.dy += rabbit.gravity;
        rabbit.y += rabbit.dy;
        
        if (rabbit.y >= rabbit.groundY) {
            rabbit.y = rabbit.groundY;
            rabbit.dy = 0;
            rabbit.onGround = true;
        }
    }
    
    // Vẽ Thỏ
    ctx.font = '60px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('🐰', rabbit.x, rabbit.y + rabbit.h/2);
    
    // Sinh vật phẩm
    spawnTimer++;
    if (spawnTimer > 100) {
        spawnItem();
        spawnTimer = 0;
    }
    
    // Vẽ và di chuyển vật phẩm
    for (let i = items.length - 1; i >= 0; i--) {
        const item = items[i];
        item.x -= item.speed;
        
        // Vẽ vật phẩm
        ctx.fillStyle = item.hasTH ? '#4caf50' : '#f44336';
        ctx.fillRect(item.x, item.y, item.w, item.h);
        ctx.strokeStyle = 'white';
        ctx.lineWidth = 3;
        ctx.strokeRect(item.x, item.y, item.w, item.h);
        
        ctx.font = '40px Arial';
        ctx.fillText(item.icon, item.x + item.w/2, item.y + item.h/2);
        
        ctx.fillStyle = 'white';
        ctx.font = 'bold 14px Arial';
        ctx.fillText(item.word, item.x + item.w/2, item.y - 10);
        
        // Kiểm tra va chạm
        if (item.x < rabbit.x + rabbit.w && item.x + item.w > rabbit.x &&
            item.y < rabbit.y + rabbit.h && item.y + item.h > rabbit.y) {
            
            if (item.hasTH) {
                score += 10;
                scoreEl.innerText = score;
                speak(item.word);
            } else {
                lives--;
                livesEl.innerText = lives;
                speak("Ối! Đó không phải chữ TH!");
                
                if (lives <= 0) {
                    gameActive = false;
                    speak("Hết máu rồi! Chơi lại nhé!");
                    setTimeout(() => {
                        document.getElementById('start-overlay').style.display = 'flex';
                    }, 2000);
                }
            }
            
            items.splice(i, 1);
        }
        
        if (item.x < -100) items.splice(i, 1);
    }
    
    requestAnimationFrame(update);
}

// Điều khiển nhảy
function jump() {
    if (rabbit.onGround && gameActive) {
        rabbit.dy = rabbit.jumpForce;
        rabbit.onGround = false;
    }
}

window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.key === 'ArrowUp') jump();
});

canvas.addEventListener('touchstart', jump);
canvas.addEventListener('mousedown', jump);
</script>
</body>
</html>
