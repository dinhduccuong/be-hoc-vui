<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TH - Thổi Nến</title>
    <style>
        body {
            margin: 0; padding: 10px; overflow: hidden;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: Arial, sans-serif; touch-action: none;
        }
        #start-overlay {
            position: fixed; inset: 0; background: white; z-index: 100;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .btn-start {
            padding: 20px 60px; font-size: 32px; font-weight: bold;
            background: #ff6b6b; color: white; border: none; border-radius: 60px;
            cursor: pointer; box-shadow: 0 10px 0 #ee5253;
        }
        #ui {
            position: absolute; top: 15px; width: 100%; text-align: center;
            pointer-events: none; z-index: 10;
        }
        .score-box {
            font-size: 28px; color: white; font-weight: bold;
            background: rgba(0,0,0,0.3); padding: 10px 25px; border-radius: 30px;
        }
        canvas {
            display: block; margin: 0 auto;
            background: #1a1a2e; border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .btn-back {
            position: fixed; top: 15px; left: 15px;
            background: #667eea; color: white; border: none;
            padding: 10px 20px; border-radius: 25px;
            font-size: 16px; font-weight: bold; cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2); z-index: 50;
            text-decoration: none; display: inline-block;
        }
        .btn-back:hover { background: #5568d3; }
        .blow-btn {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            padding: 20px 50px; font-size: 28px; font-weight: bold;
            background: #ff5252; color: white; border: none; border-radius: 50px;
            cursor: pointer; box-shadow: 0 8px 0 #d32f2f; z-index: 20;
        }
        
        @media (max-width: 600px) {
            .btn-back { top: 10px; left: 10px; padding: 8px 15px; font-size: 14px; }
            .score-box { font-size: 20px; padding: 8px 20px; }
            #start-overlay h1 { font-size: 32px !important; }
            .btn-start { padding: 15px 40px; font-size: 24px; }
            .blow-btn { padding: 15px 40px; font-size: 22px; bottom: 20px; }
        }
    </style>
</head>
<body>
    <a href="../index.html" class="btn-back">← Quay lại</a>

    <div id="start-overlay">
        <h1 style="color: #667eea; font-size: 40px;">🕯️ Thổi Nến</h1>
        <p style="font-size: 20px; color: #666; padding: 0 30px; text-align: center;">
            Đọc to chữ "TH" và thổi mạnh để tắt nến!<br>
            <small>(Chữ TH cần hơi thở mạnh nhé!)</small>
        </p>
        <button class="btn-start" onclick="startGame()">BẮT ĐẦU 🎂</button>
    </div>

    <div id="ui">
        <div class="score-box">🕯️ Nến tắt: <span id="score">0</span></div>
    </div>

    <button class="blow-btn" id="blowBtn" style="display:none;" onclick="blowCandle()">THỔI! 💨</button>

    <canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const blowBtn = document.getElementById('blowBtn');

let score = 0;
let gameActive = false;
let femaleVoice = null;
let candles = [];

// Từ vựng có chữ TH
const thWords = [
    { word: 'THỔ', icon: '🐰' },
    { word: 'THÌA', icon: '🥄' },
    { word: 'THƠ', icon: '📝' },
    { word: 'THUYỀN', icon: '⛵' },
    { word: 'THÔNG', icon: '🌲' },
    { word: 'THẬT', icon: '✨' }
];

function loadVoices() {
    const voices = window.speechSynthesis.getVoices();
    femaleVoice = voices.find(v => v.lang.includes('vi')) || voices[0];
}
window.speechSynthesis.onvoiceschanged = loadVoices;
loadVoices();

function speak(text) {
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    if (femaleVoice) utter.voice = femaleVoice;
    utter.lang = 'vi-VN';
    utter.rate = 0.6;
    window.speechSynthesis.speak(utter);
}

function startGame() {
    document.getElementById('start-overlay').style.display = 'none';
    blowBtn.style.display = 'block';
    canvas.width = Math.min(window.innerWidth - 20, 800);
    canvas.height = Math.min(window.innerHeight - 120, 600);
    
    score = 0;
    gameActive = true;
    spawnCandle();
    requestAnimationFrame(update);
}

function spawnCandle() {
    const wordData = thWords[Math.floor(Math.random() * thWords.length)];
    candles = [{
        x: canvas.width / 2,
        y: canvas.height / 2,
        flameSize: 30,
        lit: true,
        flickerOffset: 0,
        blowing: false,
        blowProgress: 0,
        ...wordData
    }];
    
    speak(`Đọc chữ ${wordData.word} và thổi mạnh nhé!`);
}

function blowCandle() {
    if (candles.length > 0 && candles[0].lit && !candles[0].blowing) {
        candles[0].blowing = true;
        speak(candles[0].word);
        
        // Hiệu ứng thổi
        setTimeout(() => {
            if (candles[0]) {
                candles[0].lit = false;
                score++;
                scoreEl.innerText = score;
                speak("Tuyệt vời! Bé thổi giỏi quá!");
                
                setTimeout(() => {
                    spawnCandle();
                }, 2000);
            }
        }, 1500);
    }
}

function update() {
    if (!gameActive) return;
    
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // Vẽ nền tối
    const grad = ctx.createRadialGradient(canvas.width/2, canvas.height/2, 0, 
                                          canvas.width/2, canvas.height/2, canvas.width/2);
    grad.addColorStop(0, '#2d3561');
    grad.addColorStop(1, '#1a1a2e');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    candles.forEach(c => {
        // Vẽ nến
        ctx.fillStyle = '#f5f5dc';
        const candleW = 60;
        const candleH = 120;
        ctx.fillRect(c.x - candleW/2, c.y, candleW, candleH);
        
        // Vẽ sáp chảy
        ctx.fillStyle = '#fffacd';
        ctx.beginPath();
        ctx.moveTo(c.x - candleW/2, c.y + 10);
        ctx.lineTo(c.x - candleW/2 - 5, c.y + 30);
        ctx.lineTo(c.x - candleW/2, c.y + 30);
        ctx.fill();
        
        if (c.lit) {
            // Hiệu ứng lung lay
            c.flickerOffset = Math.sin(Date.now() / 100) * 3;
            
            if (c.blowing) {
                c.blowProgress += 0.02;
                c.flickerOffset += Math.sin(Date.now() / 50) * 10;
            }
            
            // Vẽ ngọn lửa
            const flameX = c.x + c.flickerOffset;
            const flameY = c.y - 10;
            
            // Lửa vàng
            ctx.fillStyle = '#ffd700';
            ctx.beginPath();
            ctx.ellipse(flameX, flameY, c.flameSize * 0.6, c.flameSize, 0, 0, Math.PI * 2);
            ctx.fill();
            
            // Lửa cam
            ctx.fillStyle = '#ff6b35';
            ctx.beginPath();
            ctx.ellipse(flameX, flameY - 5, c.flameSize * 0.4, c.flameSize * 0.7, 0, 0, Math.PI * 2);
            ctx.fill();
            
            // Ánh sáng
            const lightGrad = ctx.createRadialGradient(flameX, flameY, 0, flameX, flameY, 100);
            lightGrad.addColorStop(0, 'rgba(255, 215, 0, 0.3)');
            lightGrad.addColorStop(1, 'rgba(255, 215, 0, 0)');
            ctx.fillStyle = lightGrad;
            ctx.fillRect(c.x - 100, c.y - 100, 200, 200);
        } else {
            // Khói bay lên
            ctx.fillStyle = 'rgba(150, 150, 150, 0.5)';
            for (let i = 0; i < 5; i++) {
                const smokeY = c.y - 20 - i * 15;
                const smokeSize = 10 + i * 3;
                ctx.beginPath();
                ctx.arc(c.x + Math.sin(i) * 5, smokeY, smokeSize, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        // Vẽ từ và icon
        ctx.fillStyle = 'white';
        ctx.font = 'bold 40px Arial';
        ctx.textAlign = 'center';
        ctx.fillText(c.word, c.x, c.y + candleH + 50);
        
        ctx.font = '50px Arial';
        ctx.fillText(c.icon, c.x, c.y + candleH + 110);
    });
    
    requestAnimationFrame(update);
}

// Hỗ trợ microphone (tùy chọn)
let audioContext, analyser, microphone;

async function enableMicrophone() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioContext.createAnalyser();
        microphone = audioContext.createMediaStreamSource(stream);
        microphone.connect(analyser);
        analyser.fftSize = 256;
        
        checkBlowing();
    } catch (err) {
        console.log('Microphone not available, use button instead');
    }
}

function checkBlowing() {
    if (!analyser) return;
    
    const bufferLength = analyser.frequencyBinCount;
    const dataArray = new Uint8Array(bufferLength);
    analyser.getByteFrequencyData(dataArray);
    
    const average = dataArray.reduce((a, b) => a + b) / bufferLength;
    
    if (average > 50 && candles.length > 0 && candles[0].lit && !candles[0].blowing) {
        blowCandle();
    }
    
    if (gameActive) {
        requestAnimationFrame(checkBlowing);
    }
}

// Thử bật microphone khi bắt đầu
window.addEventListener('click', () => {
    if (gameActive && !audioContext) {
        enableMicrophone();
    }
}, { once: true });
</script>
</body>
</html>
