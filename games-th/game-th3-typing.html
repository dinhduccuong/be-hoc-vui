<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TH - Tập Viết Chữ</title>
    <style>
        body {
            margin: 0; padding: 10px; overflow: hidden;
            background: linear-gradient(135deg, #ffeaa7 0%, #fdcb6e 100%);
            font-family: Arial, sans-serif; touch-action: none;
        }
        #start-overlay {
            position: fixed; inset: 0; background: white; z-index: 100;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .btn-start {
            padding: 20px 60px; font-size: 32px; font-weight: bold;
            background: #fd79a8; color: white; border: none; border-radius: 60px;
            cursor: pointer; box-shadow: 0 10px 0 #e84393;
        }
        #ui {
            position: absolute; top: 15px; width: 100%; text-align: center;
            pointer-events: none; z-index: 10;
        }
        .score-box {
            font-size: 28px; color: #d63031; font-weight: bold;
            background: rgba(255,255,255,0.9); padding: 10px 25px; border-radius: 30px;
        }
        canvas {
            display: block; margin: 0 auto;
            background: #fff; border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            cursor: crosshair;
        }
        .btn-back {
            position: fixed; top: 15px; left: 15px;
            background: #667eea; color: white; border: none;
            padding: 10px 20px; border-radius: 25px;
            font-size: 16px; font-weight: bold; cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2); z-index: 50;
            text-decoration: none; display: inline-block;
        }
        .btn-back:hover { background: #5568d3; }
        .clear-btn {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            padding: 15px 40px; font-size: 22px; font-weight: bold;
            background: #00b894; color: white; border: none; border-radius: 50px;
            cursor: pointer; box-shadow: 0 6px 0 #00896b; z-index: 20;
        }
        
        @media (max-width: 600px) {
            .btn-back { top: 10px; left: 10px; padding: 8px 15px; font-size: 14px; }
            .score-box { font-size: 20px; padding: 8px 20px; }
            #start-overlay h1 { font-size: 32px !important; }
            .btn-start { padding: 15px 40px; font-size: 24px; }
            .clear-btn { padding: 12px 30px; font-size: 18px; bottom: 20px; }
        }
    </style>
</head>
<body>
    <a href="../index.html" class="btn-back">← Quay lại</a>

    <div id="start-overlay">
        <h1 style="color: #fd79a8; font-size: 40px;">✍️ Tập Viết Chữ TH</h1>
        <p style="font-size: 20px; color: #666; padding: 0 30px; text-align: center;">
            Vẽ theo nét chữ TH thật đẹp!<br>
            <small>(Chữ TH viết liền như một chữ nhé!)</small>
        </p>
        <button class="btn-start" onclick="startGame()">BẮT ĐẦU ✏️</button>
    </div>

    <div id="ui">
        <div class="score-box">⭐ Hoàn thành: <span id="score">0</span></div>
    </div>

    <button class="clear-btn" id="clearBtn" style="display:none;" onclick="clearCanvas()">Viết Lại ↻</button>

    <canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const clearBtn = document.getElementById('clearBtn');

let score = 0;
let gameActive = false;
let femaleVoice = null;
let isDrawing = false;
let lastX = 0;
let lastY = 0;
let drawnPath = [];

// Mẫu chữ TH
const templatePath = [];
let currentTemplate = 0;

const templates = [
    { word: 'TH', color: '#e74c3c' },
    { word: 'THỎ', color: '#3498db' },
    { word: 'THÌA', color: '#2ecc71' },
    { word: 'THUYỀN', color: '#9b59b6' }
];

function loadVoices() {
    const voices = window.speechSynthesis.getVoices();
    femaleVoice = voices.find(v => v.lang.includes('vi')) || voices[0];
}
window.speechSynthesis.onvoiceschanged = loadVoices;
loadVoices();

function speak(text) {
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    if (femaleVoice) utter.voice = femaleVoice;
    utter.lang = 'vi-VN';
    utter.rate = 0.7;
    window.speechSynthesis.speak(utter);
}

function startGame() {
    document.getElementById('start-overlay').style.display = 'none';
    clearBtn.style.display = 'block';
    canvas.width = Math.min(window.innerWidth - 20, 800);
    canvas.height = Math.min(window.innerHeight - 120, 600);
    
    score = 0;
    currentTemplate = 0;
    gameActive = true;
    drawTemplate();
    speak(`Hãy viết chữ ${templates[currentTemplate].word} theo nét mẫu nhé!`);
}

function drawTemplate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // Vẽ nền
    const grad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
    grad.addColorStop(0, '#ffeaa7');
    grad.addColorStop(1, '#fdcb6e');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    // Vẽ chữ mẫu mờ
    const template = templates[currentTemplate];
    ctx.fillStyle = template.color + '33';
    ctx.strokeStyle = template.color + '66';
    ctx.lineWidth = 4;
    ctx.font = 'bold 200px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.strokeText(template.word, canvas.width/2, canvas.height/2);
    
    // Hướng dẫn
    ctx.fillStyle = '#2d3436';
    ctx.font = 'bold 24px Arial';
    ctx.fillText(`Viết chữ: ${template.word}`, canvas.width/2, 50);
    ctx.font = '18px Arial';
    ctx.fillText('(Vẽ theo nét chữ mờ)', canvas.width/2, 80);
    
    drawnPath = [];
}

function clearCanvas() {
    drawTemplate();
    speak("Thử lại nhé!");
}

function checkCompletion() {
    if (drawnPath.length > 50) {
        score++;
        scoreEl.innerText = score;
        speak(`Tuyệt vời! Chữ ${templates[currentTemplate].word} đẹp lắm!`);
        
        // Hiệu ứng hoàn thành
        ctx.fillStyle = 'rgba(46, 204, 113, 0.3)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#27ae60';
        ctx.font = 'bold 60px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('✓ Hoàn thành!', canvas.width/2, canvas.height/2);
        
        setTimeout(() => {
            currentTemplate = (currentTemplate + 1) % templates.length;
            drawTemplate();
            speak(`Bây giờ viết chữ ${templates[currentTemplate].word} nhé!`);
        }, 2000);
    }
}

// Vẽ
function startDrawing(x, y) {
    isDrawing = true;
    lastX = x;
    lastY = y;
    drawnPath = [[x, y]];
}

function draw(x, y) {
    if (!isDrawing) return;
    
    const template = templates[currentTemplate];
    ctx.strokeStyle = template.color;
    ctx.lineWidth = 8;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    
    ctx.beginPath();
    ctx.moveTo(lastX, lastY);
    ctx.lineTo(x, y);
    ctx.stroke();
    
    lastX = x;
    lastY = y;
    drawnPath.push([x, y]);
}

function stopDrawing() {
    if (isDrawing) {
        isDrawing = false;
        checkCompletion();
    }
}

// Mouse events
canvas.addEventListener('mousedown', (e) => {
    const rect = canvas.getBoundingClientRect();
    const x = (e.clientX - rect.left) * (canvas.width / rect.width);
    const y = (e.clientY - rect.top) * (canvas.height / rect.height);
    startDrawing(x, y);
});

canvas.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    const x = (e.clientX - rect.left) * (canvas.width / rect.width);
    const y = (e.clientY - rect.top) * (canvas.height / rect.height);
    draw(x, y);
});

canvas.addEventListener('mouseup', stopDrawing);
canvas.addEventListener('mouseleave', stopDrawing);

// Touch events
canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    const touch = e.touches[0];
    const rect = canvas.getBoundingClientRect();
    const x = (touch.clientX - rect.left) * (canvas.width / rect.width);
    const y = (touch.clientY - rect.top) * (canvas.height / rect.height);
    startDrawing(x, y);
});

canvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
    const touch = e.touches[0];
    const rect = canvas.getBoundingClientRect();
    const x = (touch.clientX - rect.left) * (canvas.width / rect.width);
    const y = (touch.clientY - rect.top) * (canvas.height / rect.height);
    draw(x, y);
});

canvas.addEventListener('touchend', (e) => {
    e.preventDefault();
    stopDrawing();
});
</script>
</body>
</html>
