<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bé Học Chữ A - Phản Xạ Nhanh</title>
    <style>
        body {
            margin: 0; padding: 10px;
            display: flex; flex-direction: column; align-items: center;
            background-color: #fffaf0; font-family: 'Arial', sans-serif;
            touch-action: manipulation; overflow: hidden;
        }
        #start-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #fff; z-index: 100;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .btn-start {
            padding: 20px 60px; font-size: 32px; font-weight: bold;
            background: #ff4757; color: white; border: none; border-radius: 60px;
            cursor: pointer; box-shadow: 0 10px 0 #ee5253;
        }
        #ui-layer { text-align: center; margin-bottom: 5px; width: 100%; max-width: 500px; }
        #display-box {
            background: #ffffff; border: 8px dashed #ff6b6b; border-radius: 30px;
            width: 140px; height: 140px; margin: 10px auto;
            display: flex; align-items: center; justify-content: center;
            font-size: 90px; font-weight: bold; box-shadow: 0 8px 0 #ffd3d3;
        }
        .pulse { animation: pulse 1s infinite; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
        
        canvas { background: #fff; border-radius: 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); cursor: pointer; max-width: 100%; border: 4px solid #ffde59; }
        .score-box { font-size: 24px; color: #ff4757; font-weight: bold; margin: 5px 0; }
        .btn-replay { background: #48bb78; color: white; border: none; padding: 12px 25px; border-radius: 30px; font-size: 18px; cursor: pointer; margin-top: 5px; }
        .btn-back { 
            position: fixed; top: 15px; left: 15px; 
            background: #667eea; color: white; border: none; 
            padding: 10px 20px; border-radius: 25px; 
            font-size: 16px; font-weight: bold; cursor: pointer; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.2); z-index: 50;
            text-decoration: none; display: inline-block;
        }
        .btn-back:hover { background: #5568d3; }
        
        @media (max-width: 600px) {
            body { padding: 5px; padding-top: 60px; }
            .btn-back { 
                top: 10px; left: 10px; 
                padding: 8px 15px; font-size: 14px; 
            }
            #ui-layer { margin-bottom: 5px; padding: 0 5px; }
            #msg { font-size: 18px !important; }
            #display-box { 
                width: 100px; height: 100px; 
                font-size: 60px; border-width: 5px;
            }
            .score-box { font-size: 18px; }
            .btn-replay { 
                padding: 10px 20px; font-size: 16px; 
            }
            canvas { max-width: 100%; }
        }
    </style>
</head>
<body>
    <a href="index.html" class="btn-back">← Quay lại</a>

    <div id="start-overlay">
        <h1 style="color: #5c4033; font-size: 40px;">Bé Học Dấu Thanh</h1>
        <button class="btn-start" onclick="startGame()">BẮT ĐẦU 🔊</button>
    </div>

    <div id="ui-layer">
        <div id="msg" style="color: #5c4033; font-size: 24px; font-weight: bold;">Tìm đúng chữ nhé!</div>
        <div id="display-box">A</div>
        <div class="score-box">🌟 Điểm: <span id="score">0</span> 🌟</div>
        <button class="btn-replay" onclick="playTargetSequence()">🔊 Nghe lại</button>
    </div>

    <canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const displayBox = document.getElementById('display-box');
const scoreEl = document.getElementById('score');
const msgEl = document.getElementById('msg');

let score = 0;
let items = [];
let particles = [];
let target = null;
let canClick = true;
let femaleVoice = null;
let audioTimeout = null; // Quản lý thời gian nghỉ giữa các lần đọc

// --- HỆ THỐNG GIỌNG NÓI ---
function loadVoices() {
    const voices = window.speechSynthesis.getVoices();
    femaleVoice = voices.find(v => v.lang.includes('vi') && (v.name.includes('Linh') || v.name.includes('Google') || v.name.includes('An'))) || 
                  voices.find(v => v.lang.includes('vi'));
}
window.speechSynthesis.onvoiceschanged = loadVoices;
loadVoices();

function stopSpeaking() {
    window.speechSynthesis.cancel();
    if (audioTimeout) clearTimeout(audioTimeout);
    displayBox.classList.remove('pulse');
}

function speak(text, rate = 0.6, onEnd = null) {
    const utter = new SpeechSynthesisUtterance(text);
    if (femaleVoice) utter.voice = femaleVoice;
    utter.lang = 'vi-VN';
    utter.rate = rate; 
    utter.pitch = 1.1; 
    utter.volume = 1.0; // To tối đa
    if (onEnd) utter.onend = onEnd;
    window.speechSynthesis.speak(utter);
}

function playTargetSequence() {
    stopSpeaking();
    displayBox.classList.add('pulse');

    let count = 0;
    const loop = () => {
        if (count < 3) {
            speak(target.label, 0.55, () => {
                count++;
                if (count < 3) {
                    audioTimeout = setTimeout(loop, 800); // Khoảng nghỉ ngắn hơn (0.8s)
                } else {
                    displayBox.classList.remove('pulse');
                }
            });
        }
    };
    loop();
}

// --- LOGIC GAME ---
function startGame() {
    document.getElementById('start-overlay').style.display = 'none';
    initLevel();
    animate();
}

class Particle {
    constructor(x, y, color) { this.x = x; this.y = y; this.color = color; this.size = Math.random() * 6 + 2; this.speedX = (Math.random() - 0.5) * 12; this.speedY = (Math.random() - 0.5) * 12; this.alpha = 1; }
    update() { this.x += this.speedX; this.y += this.speedY; this.alpha -= 0.02; }
    draw() { ctx.save(); ctx.globalAlpha = this.alpha; ctx.fillStyle = this.color; ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill(); ctx.restore(); }
}

class CharA {
    constructor(id, label, x, y, size, color) { this.id = id; this.label = label; this.x = x; this.y = y; this.size = size; this.color = color; this.angle = Math.random() * Math.PI; }
    draw() {
        ctx.save(); ctx.translate(this.x, this.y + Math.sin(this.angle) * 8); ctx.fillStyle = this.color; ctx.font = `bold ${this.size}px Arial`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(this.label, 0, 0);
        ctx.fillStyle = "white"; ctx.beginPath(); ctx.arc(-15, -8, 8, 0, Math.PI * 2); ctx.arc(15, -8, 8, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "black"; ctx.beginPath(); ctx.arc(-15, -8, 4, 0, Math.PI * 2); ctx.arc(15, -8, 4, 0, Math.PI * 2); ctx.fill();
        ctx.restore(); this.angle += 0.07;
    }
    isClicked(mx, my) { return Math.hypot(mx - this.x, my - this.y) < this.size * 0.7; }
}

const configs = [
    { id: 'ngang', label: 'A', color: '#ff6b6b' }, { id: 'huyen', label: 'À', color: '#54a0ff' }, { id: 'sac', label: 'Á', color: '#feca57' },
    { id: 'hoi', label: 'Ả', color: '#a29bfe' }, { id: 'nga', label: 'Ã', color: '#1dd1a1' }, { id: 'nang', label: 'Ạ', color: '#ee5253' }
];

function initLevel() {
    items = []; canClick = true;
    const s = Math.min(window.innerWidth - 30, 450);
    canvas.width = s; canvas.height = s;
    const sx = s / 3; const sy = s / 2.5;
    configs.forEach((c, i) => { const col = i % 3; const row = Math.floor(i / 3); items.push(new CharA(c.id, c.label, sx*col+sx/2, sy*row+sy/2, s/7, c.color)); });
    target = items[Math.floor(Math.random() * items.length)];
    displayBox.innerText = target.label; displayBox.style.color = target.color; displayBox.style.borderColor = target.color;
    playTargetSequence();
}

function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles = particles.filter(p => p.alpha > 0);
    particles.forEach(p => { p.update(); p.draw(); });
    items.forEach(item => item.draw());
    requestAnimationFrame(animate);
}

canvas.addEventListener('mousedown', (e) => {
    if(!canClick) return;
    const rect = canvas.getBoundingClientRect();
    const mx = (e.clientX - rect.left) * (canvas.width / rect.width);
    const my = (e.clientY - rect.top) * (canvas.height / rect.height);
    
    items.forEach(item => {
        if (item.isClicked(mx, my)) {
            if (item.id === target.id) {
                canClick = false;
                stopSpeaking(); // Dừng đọc ngay lập tức khi bé chọn đúng
                score += 10;
                scoreEl.innerText = score;
                msgEl.innerText = "Giỏi quá! Xuất sắc!";
                speak("Bé giỏi quá, đúng rồi!", 0.9); // Khen nhanh cho hào hứng
                for(let i=0; i<40; i++) particles.push(new Particle(item.x, item.y, item.color));
                setTimeout(initLevel, 2500);
            } else {
                msgEl.innerText = "Chưa đúng rồi!";
                speak("Chưa đúng rồi", 1.0);
            }
        }
    });
});
</script>
</body>
</html>
