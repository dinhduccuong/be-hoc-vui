<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chuyến Phiêu Lưu Của A - Phản Xạ Nhanh</title>
    <style>
        body {
            margin: 0; padding: 10px;
            display: flex; flex-direction: column; align-items: center;
            background-color: #e0f7fa; font-family: 'Arial', sans-serif;
            touch-action: manipulation; overflow: hidden;
        }
        #start-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: white; z-index: 100;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .btn-start {
            padding: 20px 60px; font-size: 30px; font-weight: bold;
            background: #00bcd4; color: white; border: none; border-radius: 50px;
            cursor: pointer; box-shadow: 0 8px 0 #0097a7;
        }
        #ui-panel { text-align: center; width: 100%; max-width: 500px; margin-bottom: 10px; }
        #story-box {
            background: white; padding: 12px; border-radius: 15px;
            border: 3px solid #00bcd4; min-height: 50px; font-size: 18px;
            color: #006064; margin: 10px 0; font-weight: bold; line-height: 1.4;
        }
        canvas {
            background: #ffffff; border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 100%; border: 4px solid #fff;
        }
        .controls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; width: 100%; }
        .btn-move {
            padding: 15px 5px; font-size: 24px; font-weight: bold;
            border: none; border-radius: 15px; cursor: pointer;
            color: white; box-shadow: 0 5px 0 rgba(0,0,0,0.2);
        }
        .btn-move:active { transform: translateY(3px); box-shadow: none; }
        .btn-back { 
            position: fixed; top: 15px; left: 15px; 
            background: #667eea; color: white; border: none; 
            padding: 10px 20px; border-radius: 25px; 
            font-size: 16px; font-weight: bold; cursor: pointer; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.2); z-index: 50;
            text-decoration: none; display: inline-block;
        }
        .btn-back:hover { background: #5568d3; }
    </style>
</head>
<body>
    <a href="index.html" class="btn-back">← Quay lại</a>

    <div id="start-overlay">
        <h1 style="color: #00838f;">Phiêu Lưu Cùng Bạn A</h1>
        <button class="btn-start" onclick="startGame()">BẮT ĐẦU 🚀</button>
    </div>

    <div id="ui-panel">
        <div id="story-box">Chạm vào các nút để khám phá vương quốc dấu thanh!</div>
        <div class="controls" id="btn-group"></div>
    </div>

    <canvas id="adventureCanvas"></canvas>

<script>
const canvas = document.getElementById('adventureCanvas');
const ctx = canvas.getContext('2d');
const storyEl = document.getElementById('story-box');
const btnGroup = document.getElementById('btn-group');

let charPos = { x: 0, y: 0 };
let targetPos = { x: 0, y: 0 };
let femaleVoice = null;
let currentStage = 0;

const stages = [
    { id: 'ngang', label: 'A', name: 'Ngang', color: '#ff6b6b', story: 'Đường bằng phẳng: A...A', yMod: 0 },
    { id: 'huyen', label: 'À', name: 'Huyền', color: '#54a0ff', story: 'Xuống dốc trầm: À...À', yMod: 50 },
    { id: 'sac', label: 'Á', name: 'Sắc', color: '#feca57', story: 'Leo dốc cao vút: Á...Á', yMod: -70 },
    { id: 'hoi', label: 'Ả', name: 'Hỏi', color: '#a29bfe', story: 'Móc câu luyến láy: Ả...Ả', yMod: 30 },
    { id: 'nga', label: 'Ã', name: 'Ngã', color: '#1dd1a1', story: 'Đường gập ghềnh: Ã...Ã', yMod: -20 },
    { id: 'nang', label: 'Ạ', name: 'Nặng', color: '#ee5253', story: 'Rơi bịch xuống dốc: Ạ...Ạ', yMod: 80 }
];

// --- HỆ THỐNG GIỌNG NÓI ---
function loadVoices() {
    const voices = window.speechSynthesis.getVoices();
    femaleVoice = voices.find(v => v.lang.includes('vi') && (v.name.includes('Linh') || v.name.includes('Google') || v.name.includes('An'))) || voices.find(v => v.lang.includes('vi'));
}
window.speechSynthesis.onvoiceschanged = loadVoices;
loadVoices();

function speak(text) {
    window.speechSynthesis.cancel(); // Ngắt ngay lập tức âm cũ
    const utter = new SpeechSynthesisUtterance(text);
    if (femaleVoice) utter.voice = femaleVoice;
    utter.lang = 'vi-VN';
    utter.rate = 0.65; // Tốc độ nữ nhanh vừa phải, to rõ
    utter.pitch = 1.1;
    utter.volume = 1.0;
    window.speechSynthesis.speak(utter);
}

function moveChar(index) {
    currentStage = index;
    const stage = stages[index];
    targetPos.y = (canvas.height / 2) + stage.yMod;
    storyEl.innerText = stage.story;
    speak(stage.label); // Đọc ngay khi bấm
}

function startGame() {
    document.getElementById('start-overlay').style.display = 'none';
    const s = Math.min(window.innerWidth - 30, 500);
    canvas.width = s; canvas.height = s * 0.7;
    charPos.y = canvas.height / 2;
    targetPos.y = canvas.height / 2;
    
    // Tạo nút bấm
    stages.forEach((s, index) => {
        const btn = document.createElement('button');
        btn.className = 'btn-move';
        btn.style.backgroundColor = s.color;
        btn.innerText = s.label;
        btn.onclick = () => moveChar(index);
        btnGroup.appendChild(btn);
    });

    requestAnimationFrame(animate);
}

function drawBackground() {
    ctx.beginPath();
    ctx.strokeStyle = '#bdbdbd';
    ctx.setLineDash([5, 5]);
    ctx.moveTo(0, canvas.height/2);
    ctx.lineTo(canvas.width, canvas.height/2);
    ctx.stroke();
    ctx.setLineDash([]);
}

function drawCharA(x, y, color, label) {
    ctx.save();
    ctx.translate(x, y);
    
    // Thân chữ A
    ctx.fillStyle = color;
    ctx.font = 'bold 70px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(label, 0, 0);

    // Mắt sinh động
    ctx.fillStyle = 'white';
    ctx.beginPath(); ctx.arc(-15, -10, 8, 0, Math.PI * 2); ctx.arc(15, -10, 8, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'black';
    ctx.beginPath(); ctx.arc(-15, -10, 4, 0, Math.PI * 2); ctx.arc(15, -10, 4, 0, Math.PI * 2); ctx.fill();
    
    ctx.restore();
}

function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawBackground();

    // Di chuyển mượt mà tới vị trí dốc
    charPos.y += (targetPos.y - charPos.y) * 0.15;

    const stage = stages[currentStage];
    drawCharA(canvas.width / 2, charPos.y, stage.color, stage.label);

    requestAnimationFrame(animate);
}
</script>
</body>
</html>
