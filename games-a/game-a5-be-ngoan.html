<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khu Vườn Chữ A - Bé Ngoan</title>
    <style>
        body { margin: 0; overflow: hidden; background: #fff9db; font-family: Arial, sans-serif; touch-action: none; }
        #ui { position: absolute; top: 15px; width: 100%; text-align: center; pointer-events: none; }
        .msg-box { font-size: 24px; color: #f08c00; font-weight: bold; background: white; padding: 12px 25px; border-radius: 30px; border: 4px solid #ffe066; }
        #start-overlay { position: fixed; inset: 0; background: white; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; }
        .btn-play { padding: 20px 60px; font-size: 32px; background: #fab005; color: white; border: none; border-radius: 60px; cursor: pointer; box-shadow: 0 8px 0 #f08c00; }
        .btn-back { 
            position: fixed; top: 15px; left: 15px; 
            background: #667eea; color: white; border: none; 
            padding: 10px 20px; border-radius: 25px; 
            font-size: 16px; font-weight: bold; cursor: pointer; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.2); z-index: 50;
            text-decoration: none; display: inline-block;
        }
        .btn-back:hover { background: #5568d3; }
        
        @media (max-width: 600px) {
            .btn-back { 
                top: 10px; left: 10px; 
                padding: 8px 15px; font-size: 14px; 
            }
            .msg-box { 
                font-size: 18px; padding: 10px 20px; 
            }
            #start-overlay h1 { font-size: 32px !important; }
            #start-overlay p { font-size: 16px !important; padding: 0 20px; }
            .btn-play { 
                padding: 15px 40px; font-size: 24px; 
            }
        }
    </style>
</head>
<body>
    <a href="../index.html" class="btn-back">← Quay lại</a>

    <div id="start-overlay">
        <h1 style="color: #f08c00; font-size: 40px;">Bé Ngoan Học Chữ A 🌟</h1>
        <p style="font-size: 20px; color: #5c940d;">Chạm vào dấu Ạ để nghe bé chào "Vâng ạ" nhé!</p>
        <button class="btn-play" onclick="startGame()">BẮT ĐẦU 🚀</button>
    </div>

    <div id="ui">
        <div class="msg-box" id="info">Tìm dấu thanh và xem hình nhé!</div>
    </div>

    <canvas id="gardenCanvas"></canvas>

<script>
const canvas = document.getElementById('gardenCanvas');
const ctx = canvas.getContext('2d');
const infoEl = document.getElementById('info');

let bubbles = [];
let gameActive = false;
let femaleVoice = null;

// BẢNG TỪ VỰNG CHUẨN: ƯU TIÊN TỪ "VÂNG Ạ" CHO DẤU NẶNG
const toneData = [
    { label: 'A', icon: '🥤', word: 'Cái Ca', color: '#ff6b6b' },
    { label: 'À', icon: '👵', word: 'Bà', color: '#4facfe' },
    { label: 'Á', icon: '🐟', word: 'Con Cá', color: '#fcc419' },
    { label: 'Ả', icon: '🧆', word: 'Chả Cá', color: '#a18cd1' },
    { label: 'Ã', icon: '🤕', word: 'Ngã', color: '#48c6ef' },
    { label: 'Ạ', icon: '🙇‍♂️', word: 'Vâng ạ', color: '#ff922b' }
];

function loadVoices() {
    const voices = window.speechSynthesis.getVoices();
    femaleVoice = voices.find(v => v.lang.includes('vi') && (v.name.includes('Linh') || v.name.includes('Google'))) || voices.find(v => v.lang.includes('vi'));
}
window.speechSynthesis.onvoiceschanged = loadVoices;
loadVoices();

function speak(text) {
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    if (femaleVoice) utter.voice = femaleVoice;
    utter.lang = 'vi-VN';
    utter.rate = 0.55; // Tốc độ vừa phải cho bé nghe rõ
    window.speechSynthesis.speak(utter);
}

function startGame() {
    document.getElementById('start-overlay').style.display = 'none';
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    gameActive = true;
    requestAnimationFrame(update);
}

function createBubble() {
    const data = toneData[Math.floor(Math.random() * toneData.length)];
    bubbles.push({
        x: Math.random() * (canvas.width - 120) + 60,
        y: canvas.height + 60,
        speed: -(Math.random() * 0.7 + 0.3), // Bay siêu chậm để bé dễ nhìn
        size: 55,
        clicked: false,
        ...data
    });
}

let timer = 0;
function update() {
    if (!gameActive) return;
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (++timer > 150) { createBubble(); timer = 0; }

    for (let i = bubbles.length - 1; i >= 0; i--) {
        const b = bubbles[i];
        b.y += b.speed;

        ctx.save();
        if (!b.clicked) {
            ctx.beginPath();
            ctx.arc(b.x, b.y, b.size, 0, Math.PI * 2);
            ctx.fillStyle = b.color + '22';
            ctx.fill();
            ctx.strokeStyle = b.color;
            ctx.lineWidth = 4;
            ctx.stroke();
            
            ctx.fillStyle = b.color;
            ctx.font = 'bold 50px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(b.label, b.x, b.y);
        } else {
            // Hiển thị Hình ảnh & Từ vựng
            ctx.font = '90px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(b.icon, b.x, b.y);
            
            ctx.font = 'bold 32px Arial';
            ctx.fillStyle = '#f08c00';
            ctx.fillText(b.word, b.x, b.y + 70);
            
            b.y -= 0.3; // Đứng yên hoặc bay rất chậm khi đã mở
            b.size *= 0.997;
        }
        ctx.restore();

        if (b.y < -150) bubbles.splice(i, 1);
    }
    requestAnimationFrame(update);
}

canvas.addEventListener('mousedown', (e) => {
    const rect = canvas.getBoundingClientRect();
    const mx = (e.clientX - rect.left) * (canvas.width / rect.width);
    const my = (e.clientY - rect.top) * (canvas.height / rect.height);

    bubbles.forEach(b => {
        if (!b.clicked && Math.hypot(mx - b.x, my - b.y) < b.size) {
            b.clicked = true;
            infoEl.innerText = `${b.label} - ${b.word}`;
            
            // Nếu là dấu Nặng, đọc thêm cả từ "Vâng ạ" để bé bắt chước
            if(b.label === 'Ạ') {
                speak("Ạ... Vâng ạ!");
            } else {
                speak(`${b.label}... ${b.word}`);
            }
        }
    });
});
</script>
</body>
</html>
